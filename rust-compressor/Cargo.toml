[package]
name = "ason-compressor"
version = "1.0.0"
edition = "2021"
authors = ["ASON Contributors"]
description = "ASON 2.0 - Token-optimized JSON compression for LLMs"
license = "MIT"
repository = "https://github.com/ason-format/ason"
homepage = "https://github.com/ason-format/ason"
documentation = "https://docs.rs/ason-compressor"
keywords = ["json", "compression", "llm", "serialization", "ason"]
categories = ["encoding", "data-structures", "compression"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

