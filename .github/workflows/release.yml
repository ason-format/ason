name: Release

on:
  push:
    tags:
      - 'nodejs-v*'
      - 'python-v*'
      - 'go-v*'

permissions:
  id-token: write
  contents: write

jobs:
  # Detect which language to release based on tag
  detect:
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.detect.outputs.language }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          
          if [[ "$TAG" == nodejs-v* ]]; then
            echo "language=nodejs" >> $GITHUB_OUTPUT
            echo "version=${TAG#nodejs-v}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == python-v* ]]; then
            echo "language=python" >> $GITHUB_OUTPUT
            echo "version=${TAG#python-v}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == go-v* ]]; then
            echo "language=go" >> $GITHUB_OUTPUT
            echo "version=${TAG#go-v}" >> $GITHUB_OUTPUT
          else
            echo "Unknown tag format: $TAG"
            exit 1
          fi

  # Release Node.js package to NPM
  release-nodejs:
    needs: detect
    if: needs.detect.outputs.language == 'nodejs'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: |
          cd nodejs-compressor
          npm ci
      
      - name: Build package
        run: |
          cd nodejs-compressor
          npm run build
      
      - name: Run tests
        run: |
          cd nodejs-compressor
          npm test
      
      - name: Publish to NPM with provenance
        run: |
          cd nodejs-compressor
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release Python package to PyPI
  release-python:
    needs: detect
    if: needs.detect.outputs.language == 'python'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          cd python-compressor
          python -m build
      
      - name: Publish to PyPI
        run: |
          cd python-compressor
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Python v${{ needs.detect.outputs.version }}
          body: |
            Python ASON Compressor v${{ needs.detect.outputs.version }}
            
            Install: `pip install ason-compressor==${{ needs.detect.outputs.version }}`
          draft: false
          prerelease: false

  # Release Go package (Go modules use Git tags, no publishing needed)
  release-go:
    needs: detect
    if: needs.detect.outputs.language == 'go'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Run tests
        run: |
          cd go-compressor
          go test ./tests/... -v
      
      - name: Create module tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "go-compressor/v${{ needs.detect.outputs.version }}"
          git push origin "go-compressor/v${{ needs.detect.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Go v${{ needs.detect.outputs.version }}
          body: |
            Go ASON Compressor v${{ needs.detect.outputs.version }}
            
            Install: `go get github.com/ason-format/ason/go-compressor@v${{ needs.detect.outputs.version }}`
            
            Import: `import "github.com/ason-format/ason/go-compressor/pkg/ason"`
          draft: false
          prerelease: false
